[package]
name = "prdiff"
version = "0.2.0"
edition = "2024"
description = "Real-diff checker for PR descriptions: what actually changes when head lands on base"
repository = "https://github.com/hokamsingh/prdiff"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[profile.release]
strip = true
lto = "thin"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
