<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prdiff report</title>
<style>
:root {
  --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de; --text: #1f2328; --muted: #656d76;
  --new: #0969da; --new-bg: #ddf4ff; --partial: #9a6700; --partial-bg: #fff8c5;
  --shipped: #1a7f37; --shipped-bg: #dafbe1; --pe: #8250df; --pe-bg: #fbefff;
  --add-bg: #dafbe1; --del-bg: #ffebe9; --danger: #cf222e; --danger-bg: #ffebe9;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8d96a0;
    --new: #58a6ff; --new-bg: #0c2d6b; --partial: #e3b341; --partial-bg: #3b2e00;
    --shipped: #3fb950; --shipped-bg: #0f3d1c; --pe: #bc8cff; --pe-bg: #2d1b4e;
    --add-bg: #0f3d1c; --del-bg: #4c1417; --danger: #ff7b72; --danger-bg: #4c1417;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8d96a0;
  --new: #58a6ff; --new-bg: #0c2d6b; --partial: #e3b341; --partial-bg: #3b2e00;
  --shipped: #3fb950; --shipped-bg: #0f3d1c; --pe: #bc8cff; --pe-bg: #2d1b4e;
  --add-bg: #0f3d1c; --del-bg: #4c1417; --danger: #ff7b72; --danger-bg: #4c1417;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px; }
h1 { font-size: 18px; margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
.refs .arrow { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; text-align: left; min-width: 118px; }
.chip b { display: block; font-size: 20px; line-height: 1.1; }
.chip span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chip[aria-pressed="true"] { outline: 2px solid currentColor; }
.chip.NEW { color: var(--new); } .chip.PARTIAL { color: var(--partial); }
.chip.SHIPPED { color: var(--shipped); } .chip.PATCH_EQUIVALENT { color: var(--pe); }
.chip b, .chip span { color: inherit; }
.chip span { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); margin-bottom: 12px; }
.facts b { color: var(--text); }
.add { color: var(--shipped); } .del { color: var(--danger); }
.banner { border: 1px solid var(--danger); background: var(--danger-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.ok { border-color: var(--border); background: var(--surface); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0 12px; }
.tab { background: none; border: 0; padding: 8px 14px; color: var(--muted); font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--new); font-weight: 600; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.tools input[type=search], .tools select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; }
.tools input[type=search] { flex: 1 1 220px; min-width: 0; }
.tools label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
.row { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: var(--bg); }
.head { display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; }
.head:hover { background: var(--surface); }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em; }
.badge.NEW { background: var(--new-bg); color: var(--new); }
.badge.PARTIAL { background: var(--partial-bg); color: var(--partial); }
.badge.SHIPPED { background: var(--shipped-bg); color: var(--shipped); }
.badge.PATCH_EQUIVALENT { background: var(--pe-bg); color: var(--pe); }
.badge.NEW_TO_BASE { background: var(--new-bg); color: var(--new); }
.badge.ALREADY_ON_BASE { background: var(--shipped-bg); color: var(--shipped); }
.badge.risk { background: var(--partial-bg); color: var(--partial); }
.badge.MERGED, .badge.SHIPPED_P { background: var(--shipped-bg); color: var(--shipped); }
.badge.NOT_PRESENT { background: var(--surface); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
table.train { width: 100%; border-collapse: collapse; }
table.train th, table.train td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
table.train th { position: sticky; top: 0; background: var(--bg); font-size: 12px; color: var(--muted); }
table.train td.sub { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge.plain { background: var(--surface); color: var(--muted); border: 1px solid var(--border); font-weight: 500; }
.subject { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.bar { width: 70px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--shipped); }
.body { border-top: 1px solid var(--border); padding: 8px 10px 10px; display: none; background: var(--surface); }
.row.open > .body { display: block; }
.file { margin: 8px 0 12px; }
.file > .fh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.chg { font: 600 11px var(--mono); width: 18px; text-align: center; border-radius: 4px; padding: 1px 0; background: var(--border); color: var(--text); }
.hunk { border: 1px solid var(--border); border-radius: 6px; margin: 4px 0; overflow: hidden; background: var(--bg); }
.hunk.onbase { opacity: .62; }
.hunk > .hh { display: flex; justify-content: space-between; gap: 8px; padding: 3px 8px; background: var(--surface); color: var(--muted); border-bottom: 1px solid var(--border); font: 12px var(--mono); }
.hunk pre { margin: 0; overflow-x: auto; font: 12px/1.45 var(--mono); }
.hunk pre div { padding: 0 8px; white-space: pre; min-height: 1.45em; }
.hunk pre .a { background: var(--add-bg); } .hunk pre .d { background: var(--del-bg); }
.note { color: var(--muted); font-style: italic; }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; }
.links a { color: var(--new); cursor: pointer; text-decoration: underline; }
.hidden { display: none !important; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--new); outline-offset: 1px; }
.sbs-btn { font: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 2px 9px; cursor: pointer; white-space: nowrap; }
.sbs-btn:hover { background: var(--surface); }
.rowhead { display: flex; align-items: center; }
.rowhead .head { flex: 1; min-width: 0; }
.rowhead .sbs-btn { margin-right: 10px; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; padding: 3vh 2vw; }
#modal .panel { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; width: 100%; min-height: 0; overflow: hidden; }
.mh { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.mh .title { flex: 1; min-width: 220px; word-break: break-all; }
.mh .note { font-style: normal; font-size: 12px; }
.mh label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
.scroll { overflow: auto; flex: 1; min-height: 0; }
table.sbs { border-collapse: collapse; width: 100%; table-layout: fixed; font: 12px/1.5 var(--mono); }
table.sbs th { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: left; font: 600 12.5px system-ui, sans-serif; }
table.sbs th + th { border-left: 1px solid var(--border); }
table.sbs td { vertical-align: top; padding: 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
table.sbs td.ln { width: 48px; text-align: right; color: var(--muted); user-select: none; background: var(--surface); padding: 0 6px; }
table.sbs td.code::after { content: "\200b"; }
table.sbs td.d { background: var(--del-bg); } table.sbs td.a { background: var(--add-bg); }
table.sbs td.t { background: var(--partial-bg); box-shadow: inset 3px 0 0 var(--partial); }
table.sbs td.t2 { background: var(--partial-bg); box-shadow: inset 3px 0 0 var(--danger); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--border); }
.sw.pr { background: linear-gradient(90deg, var(--del-bg) 50%, var(--add-bg) 50%); }
.sw.tgt { background: var(--partial-bg); box-shadow: inset 3px 0 0 var(--partial); }
.sw.both { background: linear-gradient(90deg, var(--partial-bg) 50%, var(--add-bg) 50%); box-shadow: inset 3px 0 0 var(--danger); }
table.sbs td.empty { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface) 6px 12px); }
table.sbs td.code + td.ln { border-left: 1px solid var(--border); }
table.sbs tr.fold td { background: var(--surface); color: var(--muted); text-align: center; cursor: pointer; padding: 4px; font-family: system-ui, sans-serif; }
table.sbs tr.fold:hover td { color: var(--text); }
@media (max-width: 640px) { .meta.wide { display: none; } .bar { width: 44px; } }
</style>
</head>
<body>
<main>
  <h1><span>prdiff</span> <span class="refs mono" id="refs"></span></h1>
  <div class="sub" id="sub"></div>
  <div class="chips" id="chips" role="group" aria-label="Filter commits by class"></div>
  <div class="facts" id="facts"></div>
  <div id="conflicts"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-commits" aria-selected="true">Commits</button>
    <button class="tab" role="tab" id="tab-files" aria-selected="false">Files</button>
    <button class="tab hidden" role="tab" id="tab-train" aria-selected="false">Train</button>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Filter by subject, sha or path  (press /)" aria-label="Filter">
    <select id="kind" aria-label="Commit kind">
      <option value="">All kinds</option><option>FEAT</option><option>FIX</option>
      <option>REFACTOR</option><option>CHORE</option><option>OTHER</option>
    </select>
    <select id="owner" aria-label="Owner" class="hidden"></select>
    <label><input type="checkbox" id="hide"> Hide already on base</label>
    <button class="tab" id="expand" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px">Expand all</button>
  </div>
  <div id="list"></div>
</main>
<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="panel">
    <div class="mh">
      <div class="title"><b id="m-title" class="mono"></b><div class="note" id="m-sub"></div><div class="legend" id="m-legend"></div></div>
      <label><input type="checkbox" id="m-collapse" checked> Collapse unchanged</label>
      <button class="sbs-btn" id="m-prev" title="Previous change">↑ Prev</button>
      <button class="sbs-btn" id="m-next" title="Next change">↓ Next</button>
      <button class="sbs-btn" id="m-close">Close (Esc)</button>
    </div>
    <div class="scroll" id="m-body"></div>
  </div>
</div>
<script id="data" type="application/json">__PRDIFF_DATA__</script>
<script>
(() => {
  const R = JSON.parse(document.getElementById('data').textContent);
  const LABEL = { NEW: 'New', PARTIAL: 'Partial', SHIPPED: 'Shipped', PATCH_EQUIVALENT: 'Patch-equivalent' };
  const HINT = {
    NEW: 'still has something to ship', PARTIAL: 'part of it is already on base',
    SHIPPED: 'content already on base', PATCH_EQUIVALENT: 'same patch is on base',
  };
  const state = { owner: '', tab: 'commits', classes: new Set(), q: '', kind: '', hide: false, open: new Set(), allOpen: false };

  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
    return el;
  };
  const short = (s) => s.slice(0, 7);
  const t = R.totals;

  // header
  document.getElementById('refs').append(
    h('b', {}, R.base.name), ' ', h('span', { class: 'arrow' }, '←'), ' ', h('b', {}, R.head.name));
  document.getElementById('sub').textContent =
    `base ${short(R.base.sha)} · head ${short(R.head.sha)} · merge-base ${short(R.merge_base)} · ${t.commits} head-only commits`;

  const chips = document.getElementById('chips');
  for (const c of ['NEW', 'PARTIAL', 'SHIPPED', 'PATCH_EQUIVALENT']) {
    chips.append(h('button', {
      class: 'chip ' + c, 'aria-pressed': 'false', title: HINT[c],
      onclick: (e) => {
        state.classes.has(c) ? state.classes.delete(c) : state.classes.add(c);
        e.currentTarget.setAttribute('aria-pressed', state.classes.has(c));
        render();
      },
    }, h('b', {}, String(t.by_class[c] ?? 0)), h('span', {}, LABEL[c])));
  }
  const facts = document.getElementById('facts');
  facts.append(
    h('span', {}, h('b', {}, String(t.files_new_to_base)), ' files new to base ',
      h('span', { class: 'add' }, '+' + t.insertions), ' ', h('span', { class: 'del' }, '−' + t.deletions)),
    h('span', {}, h('b', {}, String(t.files_already_on_base)), ' files already on base'),
    h('span', {}, h('b', {}, String(t.listed)), ' commits to list in the PR'));
  if (t.risky_files) facts.append(h('span', {}, h('b', {}, String(t.risky_files)), ' files need a closer look'));
  if (R.revert_pairs.length) facts.append(h('span', {}, h('b', {}, String(R.revert_pairs.length)), ' revert pair(s)'));

  const cf = document.getElementById('conflicts');
  if (R.conflicts.length) {
    cf.append(h('div', { class: 'banner', role: 'alert' },
      h('b', {}, `${R.conflicts.length} conflicted file(s)` + (R.conflicts_best_effort ? ' (best effort, old git)' : '')),
      h('ul', {}, R.conflicts.map((p) => {
        const d = (R.conflict_details || []).find((x) => x.path === p);
        return h('li', {}, h('code', {}, p), d ? h('div', { class: 'meta', style: 'white-space:normal' },
          'this PR: ' + (d.head_commits.map(short).join(', ') || '–') + ' · ' + R.base.name + ': ' +
          (d.base_commits.map((c) => `${short(c.sha)} ${c.subject} (${c.author})`).join('; ') || '–')) : null);
      }))));
  } else {
    cf.append(h('div', { class: 'banner ok' }, 'No merge conflicts between base and head.'));
  }

  // commits
  const filesOf = new Map(); // path -> [commit]
  for (const c of R.commits) for (const f of c.files) {
    for (const p of [f.path, f.old_path].filter(Boolean)) {
      if (!filesOf.has(p)) filesOf.set(p, []);
      filesOf.get(p).push(c);
    }
  }
  const revertedBy = new Map(R.revert_pairs.map((p) => [p.reverted, p.revert]));
  const commitBySha = new Map(R.commits.map((c) => [c.sha, c]));

  // side by side
  const sidesBy = new Map((R.file_sides || []).map((x) => [x.path, x]));
  const splitLines = (t) => (t == null || t === '' ? [] : (t.endsWith('\n') ? t.slice(0, -1) : t).split('\n'));
  function sbsButton(path) {
    if (!sidesBy.has(path)) return null;
    return h('button', {
      class: 'sbs-btn', title: `Compare ${R.base.name} with ${R.head.name}`,
      onclick: (e) => { e.stopPropagation(); openSides(path, e.currentTarget); },
    }, 'Side by side');
  }
  const modal = document.getElementById('modal');
  const mBody = document.getElementById('m-body');
  let opener = null, current = null;

  // kind: eq | pr (changed by this PR) | tgt (changed on the target since the branch point) | both
  function row(kind, l, r) {
    const lcls = { pr: 'd', tgt: 't', both: 't2' }[kind] || '';
    const rcls = kind === 'pr' || kind === 'both' ? 'a' : '';
    const cell = (v, ln, cls) => [
      h('td', { class: 'ln' }, v == null ? '' : String(ln)),
      h('td', { class: 'code ' + (v == null ? 'empty' : cls) }, v == null ? '' : v)];
    const tip = { tgt: `Changed on ${R.base.name} after this branch was cut — not part of this PR`,
      both: 'Changed on both sides — likely to need a manual merge' }[kind];
    return h('tr', { class: kind === 'eq' ? 'eq' : 'diff ' + kind, title: tip }, cell(l && l[0], l && l[1], lcls), cell(r && r[0], r && r[1], rcls));
  }
  function buildTable(s, collapse) {
    const A = splitLines(s.base_text), B = splitLines(s.head_text);
    const CTX = 3;
    const tb = h('tbody');
    const flags = (n, ranges) => { const f = new Uint8Array(n); for (const [st, len] of ranges || []) f.fill(1, st, st + len); return f; };
    const tgtFlag = flags(A.length, s.target_changed), prFlag = flags(B.length, s.pr_changed);
    const counts = { pr: 0, tgt: 0, both: 0 };
    const eq = (oi, ni, from, to) => {
      const out = [];
      for (let k = from; k < to; k++) out.push(row('eq', [A[oi + k], oi + k + 1], [B[ni + k], ni + k + 1]));
      return out;
    };
    s.ops.forEach(([tag, oi, ol, ni, nl], idx) => {
      if (tag === 0) {
        const head = idx === 0 ? 0 : CTX, tail = idx === s.ops.length - 1 ? 0 : CTX;
        if (collapse && ol > head + tail + 1) {
          const hidden = ol - head - tail;
          const fold = h('tr', { class: 'fold', title: 'Show these lines' },
            h('td', { colspan: 4 }, `⋯ ${hidden} unchanged line${hidden === 1 ? '' : 's'} · click to expand`));
          fold.addEventListener('click', () => fold.replaceWith(...eq(oi, ni, head, ol - tail)));
          tb.append(...eq(oi, ni, 0, head), fold, ...eq(oi, ni, ol - tail, ol));
        } else tb.append(...eq(oi, ni, 0, ol));
      } else {
        const n = Math.max(ol, nl);
        const rows = [];
        for (let k = 0; k < n; k++) {
          const l = k < ol ? oi + k : null, r = k < nl ? ni + k : null;
          const tgt = l != null && tgtFlag[l] === 1, pr = r != null && prFlag[r] === 1;
          let kind = 'pr';
          if (s.three_way) kind = tgt && pr ? 'both' : tgt || (l == null && !pr) ? 'tgt' : 'pr';
          rows.push([kind, row(kind, l != null ? [A[l], l + 1] : null, r != null ? [B[r], r + 1] : null)]);
        }
        const kinds = new Set(rows.map((x) => x[0]));
        const opKind = kinds.has('both') ? 'both' : kinds.has('pr') ? 'pr' : 'tgt';
        counts[opKind]++;
        rows[0][1].dataset.block = opKind;
        tb.append(...rows.map((x) => x[1]));
      }
    });
    const label = (name, role, sha, exists) => h('th', { colspan: 2 },
      `${name} `, h('span', { class: 'note' }, `(${role}${exists ? '' : ', file does not exist here'})`));
    buildTable.counts = counts;
    return h('table', { class: 'sbs' },
      h('colgroup', {}, h('col', { style: 'width:48px' }), h('col'), h('col', { style: 'width:48px' }), h('col')),
      h('thead', {}, h('tr', {}, label(R.base.name, 'target, now', R.base.sha, s.base_text != null),
        label(R.head.name, 'merging', R.head.sha, s.head_text != null))),
      tb);
  }
  function renderModal() {
    const s = current;
    document.getElementById('m-title').textContent = s.old_path ? `${s.old_path} → ${s.path}` : s.path;
    document.getElementById('m-sub').textContent =
      `${R.base.name} @ ${short(R.base.sha)} (target, as it is now)  ⟷  ${R.head.name} @ ${short(R.head.sha)} (merging)`;
    mBody.replaceChildren();
    const legend = document.getElementById('m-legend');
    legend.replaceChildren();
    const nav = !s.note && s.ops.some((o) => o[0] !== 0);
    document.getElementById('m-prev').disabled = document.getElementById('m-next').disabled = !nav;
    if (s.note) {
      mBody.append(h('div', { class: 'empty' }, `No side-by-side view: ${s.note}.`, h('br'),
        h('code', {}, `git diff ${R.base.name}...${R.head.name} -- ${s.path}`)));
    } else {
      mBody.append(buildTable(s, document.getElementById('m-collapse').checked));
      const c = buildTable.counts;
      const item = (cls, text) => h('span', { class: 'lg' }, h('i', { class: 'sw ' + cls }), text);
      if (s.three_way) {
        legend.append(
          item('pr', `${c.pr} change${c.pr === 1 ? '' : 's'} by this PR`),
          item('tgt', `${c.tgt} changed on ${R.base.name} since the branch was cut (not in this PR)`),
          item('both', `${c.both} changed on both sides`));
      } else {
        legend.append(h('span', { class: 'lg' }, `Differences may include commits that reached ${R.base.name} after this branch was cut.`));
      }
      if (!nav) mBody.prepend(h('div', { class: 'note', style: 'padding:8px 12px' }, 'No line differences (mode change only).'));
    }
    mBody.scrollTop = 0;
  }
  function openSides(path, from) {
    current = sidesBy.get(path); opener = from;
    modal.classList.remove('hidden'); document.body.style.overflow = 'hidden';
    renderModal(); document.getElementById('m-close').focus();
  }
  function closeSides() {
    modal.classList.add('hidden'); document.body.style.overflow = ''; current = null;
    if (opener && document.contains(opener)) opener.focus();
  }
  function jump(dir) {
    const blocks = [...mBody.querySelectorAll('tr[data-block]')];
    const sticky = mBody.querySelector('thead')?.offsetHeight || 0;
    const top = mBody.scrollTop + sticky + 4;
    const target = dir > 0 ? blocks.find((b) => b.offsetTop > top + 2) : [...blocks].reverse().find((b) => b.offsetTop < top - 2);
    if (target) mBody.scrollTo({ top: target.offsetTop - sticky - 24, behavior: 'smooth' });
  }
  document.getElementById('m-close').addEventListener('click', closeSides);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeSides(); });
  document.getElementById('m-collapse').addEventListener('change', () => current && renderModal());
  document.getElementById('m-next').addEventListener('click', () => jump(1));
  document.getElementById('m-prev').addEventListener('click', () => jump(-1));
  modal.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const f = [...modal.querySelectorAll('button:not([disabled]), input')];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  function hunkEl(hk) {
    const lines = hk.lines.map((l) => h('div', { class: l[0] === '+' ? 'a' : l[0] === '-' ? 'd' : '' }, l || ' '));
    if (hk.truncated) lines.push(h('div', { class: 'note' }, '… truncated (raise --max-lines)'));
    return h('div', { class: 'hunk' + (hk.on_base ? ' onbase' : '') },
      h('div', { class: 'hh' }, h('span', {}, hk.header.replace(/^(@@ [^@]+@@).*/, '$1')),
        h('span', {}, hk.on_base ? 'already on base' : 'new to base')),
      h('pre', {}, lines));
  }
  function fileEl(f) {
    const statusText = { IDENTICAL: 'identical on base', DIFFERENT: 'differs from base', ABSENT: 'not on base' }[f.status];
    const hunks = f.hunk_details || [];
    return h('div', { class: 'file' },
      h('div', { class: 'fh' },
        h('span', { class: 'chg', title: 'A added · M modified · D deleted · R renamed' }, f.change),
        h('code', {}, f.old_path ? `${f.old_path} → ${f.path}` : f.path),
        h('span', { class: 'badge plain' }, statusText),
        f.binary ? h('span', { class: 'badge plain' }, 'binary') : null,
        f.submodule ? h('span', { class: 'badge plain' }, 'submodule') : null,
        f.hunks_total ? h('span', { class: 'meta' }, `${f.hunks_already_on_base}/${f.hunks_total} hunks on base`) : null,
        sbsButton(f.path)),
      hunks.length ? hunks.map(hunkEl)
        : h('div', { class: 'note' }, f.binary ? 'Binary file: compared by blob id only.' : f.submodule ? 'Submodule pointer.' : 'No textual hunks (mode change or empty).'));
  }
  function commitEl(c) {
    const pct = c.hunks_total ? Math.round(100 * c.hunks_already_on_base / c.hunks_total) : (c.class === 'NEW' ? 0 : 100);
    const open = state.allOpen || state.open.has(c.sha);
    const row = h('div', { class: 'row' + (open ? ' open' : ''), id: 'c-' + c.sha });
    const extra = [];
    if (c.reverts && commitBySha.has(c.reverts)) extra.push(h('span', { class: 'badge plain' }, 'reverts ' + short(c.reverts)));
    if (revertedBy.has(c.sha)) extra.push(h('span', { class: 'badge plain' }, 'reverted by ' + short(revertedBy.get(c.sha))));
    if (c.matched_base_commit) extra.push(h('span', { class: 'badge plain', title: 'carried on base as this commit' }, '≡ ' + short(c.matched_base_commit)));
    row.append(
      h('button', {
        class: 'head', 'aria-expanded': String(open),
        onclick: () => { state.open.has(c.sha) ? state.open.delete(c.sha) : state.open.add(c.sha); row.classList.toggle('open'); },
      },
        h('span', { class: 'badge ' + c.class }, LABEL[c.class]),
        h('code', { class: 'mono' }, short(c.sha)),
        h('span', { class: 'subject', title: c.subject }, c.subject),
        extra,
        h('span', { class: 'meta wide' }, c.kind.toLowerCase()),
        h('span', { class: 'meta' }, `${c.files.length} file${c.files.length === 1 ? '' : 's'}`),
        h('span', { class: 'bar', title: `${pct}% of hunks already on base` }, h('i', { style: `width:${pct}%` }))),
      h('div', { class: 'body' }, c.files.length ? c.files.map(fileEl) : h('div', { class: 'note' }, 'No file changes.')));
    return row;
  }
  function netEl(f) {
    const touching = [...new Map((filesOf.get(f.path) || []).map((c) => [c.sha, c])).values()];
    const total = (f.insertions || 0) + (f.deletions || 0);
    const key = 'f-' + f.path;
    const open = state.allOpen || state.open.has(key);
    const row = h('div', { class: 'row' + (open ? ' open' : '') });
    row.append(
      h('div', { class: 'rowhead' },
      h('button', { class: 'head', 'aria-expanded': String(open), onclick: () => { state.open.has(key) ? state.open.delete(key) : state.open.add(key); row.classList.toggle('open'); } },
        h('span', { class: 'badge ' + f.state }, f.state === 'NEW_TO_BASE' ? 'New to base' : 'Already on base'),
        h('span', { class: 'chg' }, f.change),
        h('code', { class: 'subject', title: f.path }, f.old_path ? `${f.old_path} → ${f.path}` : f.path),
        (f.risk || []).map((x) => h('span', { class: 'badge risk', title: 'Worth a closer look' }, x)),
        f.owners && f.owners.length ? h('span', { class: 'meta wide', title: 'CODEOWNERS' }, f.owners.join(' ')) : null,
        f.binary ? h('span', { class: 'meta' }, 'binary')
          : h('span', { class: 'meta' }, h('span', { class: 'add' }, '+' + (f.insertions ?? 0)), ' ', h('span', { class: 'del' }, '−' + (f.deletions ?? 0))),
        h('span', { class: 'meta wide' }, `${touching.length} commit${touching.length === 1 ? '' : 's'}`)),
      sbsButton(f.path)),
      h('div', { class: 'body' }, touching.length ? touching.map((c) =>
        h('div', { class: 'links' }, h('span', { class: 'badge ' + c.class }, LABEL[c.class]), ' ',
          h('a', { onclick: () => goCommit(c.sha) }, `${short(c.sha)} ${c.subject}`))) : h('div', { class: 'note' }, 'No head-only commit touches this path.')));
    return row;
  }
  function goCommit(sha) {
    state.tab = 'commits'; state.open.add(sha); state.q = ''; state.classes.clear(); state.hide = false;
    document.getElementById('q').value = ''; document.getElementById('hide').checked = false;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
    render();
    document.getElementById('c-' + sha)?.scrollIntoView({ block: 'center' });
  }

  const PRES = { MERGED: 'merged', PATCH_EQUIVALENT: 'cherry-pick', SHIPPED: 'same content', PARTIAL: 'partial', NOT_PRESENT: 'not yet' };
  function trainEl(rows) {
    const T = R.train;
    const head = h('tr', {}, h('th', {}, 'Commit'), h('th', {}, 'Subject'),
      ...T.envs.map((e) => h('th', { title: `${e.ref} @ ${short(e.sha)}` }, `${e.name} (${e.missing} missing)`)));
    const body = rows.map((r) => h('tr', {},
      h('td', {}, h('code', {}, r.short)), h('td', { class: 'sub', title: r.subject }, r.subject),
      ...r.states.map((s) => h('td', {}, h('span', {
        class: 'badge ' + (s === 'PATCH_EQUIVALENT' ? 'PATCH_EQUIVALENT' : s === 'SHIPPED' ? 'SHIPPED' : s === 'PARTIAL' ? 'PARTIAL' : s === 'MERGED' ? 'MERGED' : 'NOT_PRESENT'),
      }, PRES[s])))));
    return h('table', { class: 'train' }, h('thead', {}, head), h('tbody', {}, body));
  }

  function render() {
    document.getElementById('tab-train').classList.toggle('hidden', !R.train);
    for (const k of ['commits', 'files', 'train']) document.getElementById('tab-' + k).setAttribute('aria-selected', String(state.tab === k));
    document.getElementById('kind').classList.toggle('hidden', state.tab !== 'commits');
    document.getElementById('owner').classList.toggle('hidden', state.tab !== 'files' || !(R.owners_summary || []).length);
    const q = state.q.toLowerCase();
    const list = document.getElementById('list');
    list.replaceChildren();
    let shown = [];
    if (state.tab === 'train' && R.train) {
      shown = R.train.rows.filter((r) =>
        (!state.hide || r.states.some((s) => s === 'NOT_PRESENT' || s === 'PARTIAL')) &&
        (!q || r.subject.toLowerCase().includes(q) || r.sha.startsWith(q)));
      if (shown.length) list.append(trainEl(shown));
    } else if (state.tab === 'commits') {
      shown = R.commits.filter((c) =>
        (!state.classes.size || state.classes.has(c.class)) &&
        (!state.kind || c.kind === state.kind) &&
        (!state.hide || c.class === 'NEW' || c.class === 'PARTIAL') &&
        (!q || c.subject.toLowerCase().includes(q) || c.sha.startsWith(q) || c.files.some((f) => f.path.toLowerCase().includes(q))));
      list.append(...shown.map(commitEl));
    } else {
      shown = R.net_files.filter((f) =>
        (!state.hide || f.state === 'NEW_TO_BASE') && (!q || f.path.toLowerCase().includes(q)) &&
        (!state.owner || (f.owners || []).includes(state.owner)));
      list.append(...shown.map(netEl));
    }
    if (!shown.length) list.append(h('div', { class: 'empty' }, 'Nothing matches the current filters.'));
  }

  document.getElementById('tab-commits').onclick = () => { state.tab = 'commits'; render(); };
  document.getElementById('tab-files').onclick = () => { state.tab = 'files'; render(); };
  document.getElementById('tab-train').onclick = () => { state.tab = 'train'; render(); };
  document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
  const ownerSel = document.getElementById('owner');
  ownerSel.append(h('option', { value: '' }, 'All owners'),
    ...(R.owners_summary || []).map((o) => h('option', { value: o.owner }, `${o.owner} (${o.files})`)));
  ownerSel.addEventListener('change', (e) => { state.owner = e.target.value; render(); });
  document.getElementById('kind').addEventListener('change', (e) => { state.kind = e.target.value; render(); });
  document.getElementById('hide').addEventListener('change', (e) => { state.hide = e.target.checked; render(); });
  document.getElementById('expand').addEventListener('click', (e) => {
    state.allOpen = !state.allOpen; state.open.clear();
    e.currentTarget.textContent = state.allOpen ? 'Collapse all' : 'Expand all'; render();
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.classList.contains('hidden')) { closeSides(); return; }
    if (!modal.classList.contains('hidden')) return;
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q').focus(); }
  });
  render();
})();
</script>
</body>
</html>
